name: app_mobile
description: "App mobile do Laboratório Catarina Domingos (clínicas e colaboradores)."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.10.4
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  go_router: ^17.5.0 # navegação entre ecrãs
  http: ^1.6.0 # pedidos à API
  image_picker: ^1.2.3 # fotografias: câmara e galeria
  file_picker: ^13.3.3 # ficheiros STL / ZIP
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - images/logo.png
